name: Release

on:
  push:
    tags:
      - 'v*'
  # Run by hand to build the latest release's binaries again.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: petri-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: petri-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: petri-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: petri-macos-aarch64

    steps:
      - name: Find the release to build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag push builds that tag. A run by hand builds the latest release again.
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME
          else tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          path: petri
          ref: ${{ env.TAG }}

      - name: Checkout crust
        uses: actions/checkout@v4
        with:
          repository: isene/crust
          path: crust

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 linker (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        working-directory: petri
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        working-directory: petri
        run: |
          cp target/${{ matrix.target }}/release/petri ../${{ matrix.artifact }}
          chmod +x ../${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation

            Download the binary for your platform and run it:
            ```bash
            chmod +x petri-*
            ./petri-linux-x86_64    # or your platform
            ```

            Optionally copy to your PATH:
            ```bash
            sudo cp petri-linux-x86_64 /usr/local/bin/petri
            ```

            ## Platforms
            - `petri-linux-x86_64`  - Linux (Intel/AMD 64-bit)
            - `petri-linux-aarch64` - Linux (ARM64, Raspberry Pi)
            - `petri-macos-x86_64`  - macOS (Intel)
            - `petri-macos-aarch64` - macOS (Apple Silicon)

      - name: Upload the binaries, one at a time
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The upload endpoint answers 500 when several files go up at once.
          tag=$GITHUB_REF_NAME
          [ "$GITHUB_REF_TYPE" = tag ] || tag=$(gh release view --json tagName -q .tagName)
          for f in artifacts/*/*; do
            for try in 1 2 3; do
              gh release upload "$tag" "$f" --clobber && break
              echo "upload of $f failed; waiting 10 s"
              sleep 10
            done
          done
