<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f74c00"/>
      <stop offset="100%" stop-color="#b7410e"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a6"/>
    </marker>
  </defs>

  <!-- suite disc: dark face, rust ring -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>

  <!-- a conflict: one marked place feeding two transitions.
       The net cannot decide which fires. -->

  <!-- source place with token -->
  <circle cx="128" cy="66" r="20" fill="none" stroke="#33e0ff" stroke-width="3"/>
  <circle cx="128" cy="66" r="7" fill="#ffd75f"/>

  <!-- arcs to the two competing transitions -->
  <line x1="115" y1="82" x2="84" y2="112" stroke="#8a94a6" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="141" y1="82" x2="172" y2="112" stroke="#8a94a6" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- transition bars (one green = about to fire, one rust = the road not taken) -->
  <rect x="62" y="116" width="36" height="12" rx="2" fill="#46d246"/>
  <rect x="158" y="116" width="36" height="12" rx="2" fill="url(#rust)"/>

  <!-- arcs onward to the outcome places -->
  <line x1="80" y1="128" x2="80" y2="156" stroke="#8a94a6" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="176" y1="128" x2="176" y2="156" stroke="#8a94a6" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- outcome places, empty: the future is open -->
  <circle cx="80" cy="176" r="17" fill="none" stroke="#33e0ff" stroke-width="3"/>
  <circle cx="176" cy="176" r="17" fill="none" stroke="#33e0ff" stroke-width="3" opacity="0.55"/>

  <!-- wordmark -->
  <text x="128" y="226" font-family="monospace" font-size="24" font-weight="bold" fill="url(#rust)" text-anchor="middle" letter-spacing="4">petri</text>
</svg>
