[package]
name = "petri"
version = "0.1.0"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Terminal Petri net player: load a net, fire transitions, watch conflicts, find deadlocks. Built on crust."
license = "Unlicense"
repository = "https://github.com/isene/petri"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = true
